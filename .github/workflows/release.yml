name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Required repository secrets:
    # - PUBLISHER_PORTAL_USERNAME
    # - PUBLISHER_PORTAL_TOKEN
    # - GPG_PRIVATE_KEY
    # - GPG_PASSPHRASE
    # - NPM_TOKEN (jdeploy publishes the showcase installer to npm)
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 'Set up Java 25'
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: 'Cache Maven packages'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 'Update version'
        id: version
        run: |
          VERSION=${{ github.event.inputs.version }}
          OLD_VERSION=$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "Updating POMs from version $OLD_VERSION to version $VERSION"
          ./mvnw -B versions:set versions:commit -DnewVersion=$VERSION -DprocessAllModules=true
          echo "Updating documentation to version $VERSION"
          sed -i "s|$OLD_VERSION|$VERSION|g" README.md NOTICE.md .github/ISSUE_TEMPLATE/bug_report.yml
          echo "Updating the jdeploy package of the showcase to version $VERSION"
          npm --prefix FlexGanttFXShowcase pkg set version="$VERSION" jdeploy.jar="target/showcase-$VERSION.jar"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Action"
          git commit -a -m "🏁 Releasing version $VERSION"
          git push origin HEAD:master

      # Builds and tests the whole reactor, including the assembly ZIPs that the GitHub
      # release step attaches. The TestFX based UI tests need an X display, hence
      # xvfb-run. Xvfb is pre-installed on the GitHub-hosted Ubuntu runners.
      - name: 'Build'
        run: |
          xvfb-run -a ./mvnw --no-transfer-progress -B --file pom.xml \
            -Dmaven.site.skip=true install

      # Publishes the four library modules and the parent POM. The deploy has to be
      # scoped with -pl: the central-publishing plugin defers the upload of the whole
      # bundle to the last module of the reactor, and that module (FlexGanttFXAssembly)
      # sets skipPublishing - which silently cancelled the upload for the entire build.
      # Tests already ran in the previous step.
      - name: 'Release to Maven Central'
        env:
          MAVEN_USERNAME: ${{ secrets.PUBLISHER_PORTAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.PUBLISHER_PORTAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GPG_TTY=$(tty)
          ./mvnw --no-transfer-progress -B --file pom.xml \
            -Dmaven.site.skip=true -Drelease=true -DskipTests deploy -s ./settings.xml \
            -pl FlexGanttFXCore,FlexGanttFXModel,FlexGanttFXView,FlexGanttFXExtras -am

      # Publishes the showcase application to npm, which is how its jdeploy installer
      # and download page (https://www.jdeploy.com/~flexganttfxshowcase) are updated.
      # Version and JAR path were set in the 'Update version' step (jdeploy documents a
      # glob for "jar", but that is broken in 6.1.5), and the JAR was built above.
      - name: 'Set up Node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: 'Publish showcase installer with jdeploy'
        working-directory: FlexGanttFXShowcase
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g jdeploy@6.1.5
          jdeploy publish

      # Creates the tag, the changelog and the GitHub release and attaches the
      # assembly ZIPs built by the previous step.
      - name: 'Release to GitHub'
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B --file pom.xml -Prelease -pl :gantt jreleaser:full-release

      - name: 'JReleaser output'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties
