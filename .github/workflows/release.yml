name: 'Release'
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: ./.github/actions/prepare-java

      - name: 'Version'
        id: vars
        shell: bash
        run: |
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      # The UI tests (TestFX) need an X display. Xvfb is pre-installed on the
      # GitHub-hosted Ubuntu runners.
      - name: 'Build with Maven'
        run: xvfb-run -a mvn -B install --file pom.xml

      - name: 'Create Release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./FlexGanttFXAssembly/target/flexganttfx-${{ steps.vars.outputs.VERSION }}-bin.zip
            ./FlexGanttFXAssembly/target/flexganttfx-${{ steps.vars.outputs.VERSION }}-src.zip

  deploy:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest
    # Required repository secrets:
    # - MAVEN_USERNAME
    # - MAVEN_CENTRAL_TOKEN
    # - MAVEN_GPG_PASSPHRASE
    # - GPG_PRIVATE_KEY
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Only the four library modules are published. The demos, showcase,
      # tutorials and assembly modules are excluded because they are not part of
      # the release and pull in artifacts that are not on Maven Central.
      - name: Deploy with Maven
        run: >
          xvfb-run -a
          mvn -B -Prelease deploy -s settings.xml --file pom.xml
          -pl FlexGanttFXCore,FlexGanttFXModel,FlexGanttFXView,FlexGanttFXExtras -am
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
