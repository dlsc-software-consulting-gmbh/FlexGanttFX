aapl = Apple Inc. and its wholly-owned subsidiaries design, manufacture, and market mobile communication and media devices, personal computers, and portable digital music players worldwide.
orcl = Oracle Corporation develops, manufactures, markets, hosts, and supports database and middleware software, applications software, and hardware systems. It licenses database and middleware software, including database and database management, application server and cloud application.;
amzn= Amazon.com, Inc. operates as an online retailer in North America and internationally. The company operates in two segments, North America and International.
intc=Intel Corporation designs, manufactures, and sells integrated digital technology platforms worldwide. It operates through PC Client Group, Data Center Group, Other Intel Architecture, Software and Services, and All Other segments
ebay=eBay Inc. provides online platforms, tools, and services to help individuals and merchants in online and mobile commerce and payments in the United States and internationally.
msft=Microsoft Corporation develops, licenses, and supports software, services, and hardware devices. Its Windows division offers Windows operating system; Windows Services suite of applications and Web services, including Outlook.com and SkyDrive.
yhoo=Yahoo! Inc. operates as a technology company worldwide. The company offers search products, including Yahoo Search that serves as a starting point to navigate the Internet and discover information.