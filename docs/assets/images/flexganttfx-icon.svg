<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bar-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="256" height="256" rx="44" fill="#0f172a"/>

  <!-- Subtle vertical grid lines -->
  <line x1="104" y1="38" x2="104" y2="218" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="156" y1="38" x2="156" y2="218" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="208" y1="38" x2="208" y2="218" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Bar 1: blue -->
  <rect x="28" y="38"  width="164" height="32" rx="7" fill="#1d4ed8"/>
  <rect x="28" y="38"  width="164" height="32" rx="7" fill="url(#bar-shine)"/>

  <!-- Bar 2: sky -->
  <rect x="46" y="86"  width="112" height="32" rx="7" fill="#0369a1"/>
  <rect x="46" y="86"  width="112" height="32" rx="7" fill="url(#bar-shine)"/>

  <!-- Bar 3: cyan -->
  <rect x="102" y="134" width="126" height="32" rx="7" fill="#0891b2"/>
  <rect x="102" y="134" width="126" height="32" rx="7" fill="url(#bar-shine)"/>

  <!-- Bar 4: teal -->
  <rect x="28" y="182" width="82"  height="32" rx="7" fill="#0d9488"/>
  <rect x="28" y="182" width="82"  height="32" rx="7" fill="url(#bar-shine)"/>

  <!-- Dependency arrow: right-end of bar 2 → left-start of bar 3 -->
  <!-- bar 2 center-y = 86+16=102, right-x = 46+112=158 -->
  <!-- bar 3 center-y = 134+16=150, left-x = 102 -->
  <polyline
    points="158,102 158,150 107,150"
    stroke="#f59e0b" stroke-width="3" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrowhead tip at (102,150) pointing left -->
  <polygon points="102,145 102,155 111,150" fill="#f59e0b"/>
</svg>
