<!-- Start Pupolar Article  Area -->
<section class="pupolar-article-area bg-color1">
    <div class="pupolar-article-wrapper  section-spacing bminus-30">
        <div class="container">
            <div class="section-title">
                <h2 class="heading-2">Videos</h2>
                <p>These videos show where and how FlexGanttFX can be used and deployed.</p>
            </div>
            <div class="row">
                <div class="col-md-12 col-lg-12">
                    <article class="pupolar-item bg-color3 wow fadeIn" data-wow-duration="3s">
                        <header class="popular-item-top">
                            <div class="popular-top-logo">
                                <div class="popular-logo-icon">
                                    <img src="{{ '/assets/images/popular-3.png' | relative_url }}" alt="service icon">
                                </div>
                            </div>
                            <div class="popular-top-title">
                                <h5 class="heading-5">Real World Examples</a></h5>
                            </div>
                        </header>
                        {% for video in site.data.videos %}
                        <div class="row" style="padding: 0px 0px 40px 0px;">
                            <div class="col-md-6 col-lg-9">
                                <b>{{video.title}} - </b>
                                {{video.text}} <p/><br/><a href="{{video.url}}" target="_blank" class="btn btn-style2" style="padding: 5px 15px;">Show Video</a>
                            </div>
                            <div class="col-md-6 col-lg-3">
                                <a href="{{video.url}}">
                                    <img src="{{video.image}}" target="_blank" style="border: 5px solid #0D65B0; border-radius: 4px;"/>
                                </a>
                            </div>
                        </div>
                        {% endfor %}
                    </article>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- End Pupolar Article Area -->
