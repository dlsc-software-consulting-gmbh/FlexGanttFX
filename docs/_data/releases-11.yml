- release: Release 11.12.5
  date: March 30th, 2022
  url: ../../downloads/flexganttfx-11.12.5-bin.zip
  text: Fixed various rendering issues where vertical lines were not aligned properly (grid lines, 'now' line), chart layout scale fixes, scrollbar behaviour fixes.

- release: Release 11.12.4
  date: April 21, 2021
  url: ../../downloads/flexganttfx-11.12.4-bin.zip
  text: Enhanced the scrollbar behaviour for "fixed horizon" scrolling. The end date of the horizon will now remain on the right edge of the viewport.

- release: Release 11.12.3
  date: April 9th, 2021
  url: ../../downloads/flexganttfx-11.12.3-bin.zip
  text: Added support for a fixed horizon scrollbar. Added a flag for turning on/off auto-hiding the scrollbars. Fixed the drawing of grid lines when displaying hour granularity with a step rate larger than 1.

- release: Release 11.12.0
  date: May 14th, 2020
  url: ../../downloads/flexganttfx-11.12.0-bin.zip
  text: Replaced custom mouse cursors with standard system cursors. Row resizing via new row headers on right-hand side. Removed dateline scrolling events. Enhanced RadarView's rendering performance.

- release: Release 11.11.0
  date: May 2020
  url: ../../downloads/flexganttfx-11.11.0-bin.zip
  text: Replaced icon PNG files with Ikonli font icons. Added show / hide links support (incl. toolbar button). Added row headers for right-hand side. Redraws now batched and using pulse listener for increased performance.

- release: Release 11.10.0 (Performance Release)
  date: March 2020
  url: ../../downloads/flexganttfx-11.10.0-bin.zip
  text: Replaced LinksPane with LinksCanvas. Links are now drawn via Canvas API. Replaced observable list of activity links with an IntervalTree for faster lookup. Customizable link renderers. Fixed CSS issue in Dateline layout code.

- release: Release 11.9.1
  date: October 24th, 2020
  url: ../../downloads/flexganttfx-11.9.1-bin.zip
  text: Various bug fixes and enhancements.