- product_name: Release 11.12.8
  updated_date: January 17th 2024
  changelog: <li><i class="changelog-fix"></i>Changed the type of various JAR files to be of type "jar" instead of type "bundle". The building of OSGI bundles pulled in native dependencies (javafx native libs), which could lead to JavaFX using the bundled libraries instead of the ones used by the project's required JavaFX version.</li>

