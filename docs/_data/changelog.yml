- product_name: Release 11.12.5
  updated_date: March 30th 2022
  changelog: <li><i class="changelog-bug"></i>Now line is not straight after zooming in</li>
             <li><i class="changelog-bug"></i>yOffset is not working when ChartLayout max and min values are the same.</li>
